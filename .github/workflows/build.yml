name: Build releases

# Release automatique : un push sur main qui change APP_VERSION (web/app.js)
# publie la version si elle n'a pas encore de release. Le tag est créé ici,
# par GitHub, avec son jeton interne : plus besoin de pousser un tag.
on:
  push:
    branches: [main]
    paths: ["web/app.js", ".github/workflows/build.yml"]
    tags: ["v*"]
  workflow_dispatch:

# Actions épinglées par empreinte de commit (un tag peut être déplacé, pas une
# empreinte) ; dépendances Python figées avec leurs sommes (requirements-build.lock).
# Mises à jour proposées par Dependabot (.github/dependabot.yml).
permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG=$(grep -oE "const APP_VERSION = 'v[0-9]+\.[0-9]+\.[0-9]+'" web/app.js | grep -oE "v[0-9]+\.[0-9]+\.[0-9]+")
          fi
          if [ -z "$TAG" ]; then echo "APP_VERSION introuvable"; exit 1; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG déjà publiée : rien à faire."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Nouvelle version $TAG : build + release."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12.16"
      - run: python -m pip install --require-hashes --no-deps -r requirements-build.lock

      # ffmpeg (build GPL, gyan.dev) et fpcalc (Chromaprint) embarqués.
      # Versions ÉPINGLÉES et sommes SHA-256 vérifiées : un fichier différent de
      # celui audité arrête le build (audit sécurité S1). Mise à jour = changer
      # l'URL ET l'empreinte, après lecture des notes de version/CVE.
      - name: Download ffmpeg
        run: |
          curl -fL -o ffmpeg.zip https://www.gyan.dev/ffmpeg/builds/packages/ffmpeg-9.0.2-essentials_build.zip
          if ((Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash -ne '60F467265B1E312373DBCD92200C2618A74850F98D3D078E94296BB3FA2047BA') { throw 'ffmpeg.zip : somme SHA-256 inattendue' }
          7z e ffmpeg.zip -offbin */bin/ffmpeg.exe -r
          move ffbin\ffmpeg.exe ffmpeg.exe
          ./ffmpeg.exe -version
      - name: Download fpcalc
        run: |
          curl -fL -o fpcalc.zip https://github.com/acoustid/chromaprint/releases/download/v1.6.1/chromaprint-fpcalc-1.6.1-windows-x86_64.zip
          if ((Get-FileHash fpcalc.zip -Algorithm SHA256).Hash -ne '735D6182B38E9F364B84CE6F4CCD682C75E2851DE89735711D6B762D12B92A4E') { throw 'fpcalc.zip : somme SHA-256 inattendue' }
          7z e fpcalc.zip -ofpbin fpcalc.exe -r
          move fpbin\fpcalc.exe fpcalc.exe
          ./fpcalc.exe -version

      - run: >
          pyinstaller --noconfirm --windowed --name "DJ Helper"
          --icon assets/icon.ico
          --add-data "web;web" --add-data "cacert.pem;."
          --add-binary "ffmpeg.exe;." --add-binary "fpcalc.exe;."
          --collect-all webview --collect-submodules mutagen
          --hidden-import numpy --hidden-import rapidfuzz main.py
      - run: Compress-Archive -Path "dist/DJ Helper" -DestinationPath "DJHelper-windows.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: windows
          path: DJHelper-windows.zip

  macos:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12.16"
      - run: python -m pip install --require-hashes --no-deps -r requirements-build.lock

      - name: Download ffmpeg
        run: |
          # build arm64 natif (martin-riedl.de, signé) : evermeet.cx ne fournit
          # que de l'Intel, inutilisable sans Rosetta dans une appli arm64
          curl -fL -o ffmpeg.zip https://ffmpeg.martin-riedl.de/download/macos/arm64/1789931890_9.0.2/ffmpeg.zip
          echo "c8ed4c4e6978a03c485edbfe4e0a5dc2380f8a30bba5150531b31b094492d924  ffmpeg.zip" | shasum -a 256 -c -
          unzip -o ffmpeg.zip
          chmod +x ffmpeg
          lipo -archs ffmpeg | grep -q arm64
          ./ffmpeg -version | head -1
      - name: Download fpcalc
        run: |
          curl -fL -o fpcalc.tgz https://github.com/acoustid/chromaprint/releases/download/v1.6.1/chromaprint-fpcalc-1.6.1-macos-universal.tar.gz
          echo "240aeb5a8c8205af458e3625cb7487b826b711a999e491ef00111f3cebd76f00  fpcalc.tgz" | shasum -a 256 -c -
          tar xzf fpcalc.tgz --strip-components=1
          chmod +x fpcalc
          # binaire universel (Intel + Apple Silicon) : l'appli est arm64, un
          # fpcalc Intel seul échouait sur chaque fichier sans Rosetta
          file fpcalc
          lipo -archs fpcalc | grep -q arm64
          ./fpcalc -version
      - name: Build icns
        run: |
          mkdir icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icon.png --out icon.iconset/icon_${s}x${s}.png
            sips -z $((s*2)) $((s*2)) assets/icon.png --out icon.iconset/icon_${s}x${s}@2x.png
          done
          iconutil -c icns icon.iconset -o DJHelper.icns

      - run: >
          pyinstaller --noconfirm --windowed --name "DJ Helper"
          --icon DJHelper.icns
          --add-data "web:web" --add-data "cacert.pem:."
          --add-binary "ffmpeg:." --add-binary "fpcalc:."
          --collect-all webview --collect-submodules mutagen
          --hidden-import numpy --hidden-import rapidfuzz main.py
      - run: ditto -c -k --keepParent "dist/DJ Helper.app" DJHelper-macos.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: macos
          path: DJHelper-macos.zip

  publish:
    # Release créée seulement quand les DEUX builds ont réussi (atomique)
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write        # signature Sigstore de l'attestation de provenance
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: dist
      # Attestation de provenance (Sigstore) : prouve que les zips sortent de CE
      # dépôt et de CE build. Vérification : gh attestation verify <zip> -R hfreryr/DJ-HELPER
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/windows/DJHelper-windows.zip
            dist/macos/DJHelper-macos.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # sommes de contrôle publiées avec la release (audit sécurité S5)
          (cd dist && sha256sum windows/DJHelper-windows.zip macos/DJHelper-macos.zip \
            | sed 's#  [a-z]*/#  #' > SHA256SUMS && cat SHA256SUMS)
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --notes "DJ Helper $TAG — vérification : sha256sum -c SHA256SUMS" \
            dist/windows/DJHelper-windows.zip dist/macos/DJHelper-macos.zip dist/SHA256SUMS

  cleanup:
    # Ne garder que les 3 dernières releases : supprime les plus anciennes (release + tag)
    runs-on: ubuntu-latest
    needs: [publish]
    steps:
      - name: Keep only the 3 latest releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # triées de la plus récente à la plus ancienne ; on saute les 3 premières
          for tag in $(gh release list -R "${GITHUB_REPOSITORY}" --json tagName -q '.[].tagName' | tail -n +4); do
            echo "suppression $tag"
            gh release delete "$tag" -R "${GITHUB_REPOSITORY}" --yes --cleanup-tag || true
          done
