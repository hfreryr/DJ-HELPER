name: Build releases

# Release automatique : un push sur main qui change APP_VERSION (web/app.js)
# publie la version si elle n'a pas encore de release. Le tag est créé ici,
# par GitHub, avec son jeton interne : plus besoin de pousser un tag.
on:
  push:
    branches: [main]
    paths: ["web/app.js", ".github/workflows/build.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG=$(grep -oE "const APP_VERSION = 'v[0-9]+\.[0-9]+\.[0-9]+'" web/app.js | grep -oE "v[0-9]+\.[0-9]+\.[0-9]+")
          fi
          if [ -z "$TAG" ]; then echo "APP_VERSION introuvable"; exit 1; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG déjà publiée : rien à faire."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Nouvelle version $TAG : build + release."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller

      # ffmpeg (build GPL, gyan.dev) et fpcalc (Chromaprint) embarqués
      - name: Download ffmpeg
        run: |
          curl -L -o ffmpeg.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
          7z e ffmpeg.zip -offbin */bin/ffmpeg.exe -r
          move ffbin\ffmpeg.exe ffmpeg.exe
      - name: Download fpcalc
        run: |
          curl -fL -o fpcalc.zip https://github.com/acoustid/chromaprint/releases/download/v1.6.1/chromaprint-fpcalc-1.6.1-windows-x86_64.zip
          7z e fpcalc.zip -ofpbin fpcalc.exe -r
          move fpbin\fpcalc.exe fpcalc.exe

      - run: >
          pyinstaller --noconfirm --windowed --name "DJ Helper"
          --icon assets/icon.ico
          --add-data "web;web" --add-data "cacert.pem;."
          --add-binary "ffmpeg.exe;." --add-binary "fpcalc.exe;."
          --collect-all webview --collect-submodules mutagen
          --hidden-import numpy --hidden-import rapidfuzz main.py
      - run: Compress-Archive -Path "dist/DJ Helper" -DestinationPath "DJHelper-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: DJHelper-windows.zip

  macos:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller

      - name: Download ffmpeg
        run: |
          curl -L -o ffmpeg.zip "https://evermeet.cx/ffmpeg/getrelease/zip"
          unzip -o ffmpeg.zip
          chmod +x ffmpeg
      - name: Download fpcalc
        run: |
          curl -fL -o fpcalc.tgz https://github.com/acoustid/chromaprint/releases/download/v1.6.1/chromaprint-fpcalc-1.6.1-macos-universal.tar.gz
          tar xzf fpcalc.tgz --strip-components=1
          chmod +x fpcalc
          # binaire universel (Intel + Apple Silicon) : l'appli est arm64, un
          # fpcalc Intel seul échouait sur chaque fichier sans Rosetta
          file fpcalc
          lipo -archs fpcalc | grep -q arm64
          ./fpcalc -version
      - name: Build icns
        run: |
          mkdir icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icon.png --out icon.iconset/icon_${s}x${s}.png
            sips -z $((s*2)) $((s*2)) assets/icon.png --out icon.iconset/icon_${s}x${s}@2x.png
          done
          iconutil -c icns icon.iconset -o DJHelper.icns

      - run: >
          pyinstaller --noconfirm --windowed --name "DJ Helper"
          --icon DJHelper.icns
          --add-data "web:web" --add-data "cacert.pem:."
          --add-binary "ffmpeg:." --add-binary "fpcalc:."
          --collect-all webview --collect-submodules mutagen
          --hidden-import numpy --hidden-import rapidfuzz main.py
      - run: ditto -c -k --keepParent "dist/DJ Helper.app" DJHelper-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: DJHelper-macos.zip

  publish:
    # Release créée seulement quand les DEUX builds ont réussi (atomique)
    needs: [version, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$TAG" --notes "DJ Helper $TAG" \
            dist/windows/DJHelper-windows.zip dist/macos/DJHelper-macos.zip

  cleanup:
    # Ne garder que les 3 dernières releases : supprime les plus anciennes (release + tag)
    runs-on: ubuntu-latest
    needs: [publish]
    steps:
      - name: Keep only the 3 latest releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # triées de la plus récente à la plus ancienne ; on saute les 3 premières
          for tag in $(gh release list -R "${GITHUB_REPOSITORY}" --json tagName -q '.[].tagName' | tail -n +4); do
            echo "suppression $tag"
            gh release delete "$tag" -R "${GITHUB_REPOSITORY}" --yes --cleanup-tag || true
          done
